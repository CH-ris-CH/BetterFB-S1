[include KAMP_Settings.cfg]

#####################################################################
#                             G-Code Macro
#####################################################################
[gcode_macro LIGHT_ON]
gcode:
  SET_LED LED=LED0 WHITE=1

[gcode_macro LIGHT_OFF]
gcode:
  SET_LED LED=LED0 WHITE=0

[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-3} MAXIMUM={s+5}   ; Wait for hotend temp (within 1 degree)
    {% endif %}
[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-5} MAXIMUM={s+10}  ; Wait for bed temp (within 1 degree)
    {% endif %}
    
[gcode_macro clamp_fan0]
gcode:
    {% if 'S' in params %}
        {% set s = params.S|int %}
        {% if s < 0 or s > 255 %}
            { action_raise_error("Значение S должно быть 0-255") }
        {% else %}
            SAVE_VARIABLE VARIABLE=max_fan0_speed VALUE={s}
        {% endif %}
    {% endif %}

[gcode_macro M106]
#rename_existing: M1006
gcode:
    {% set max_fan0 = printer.save_variables.variables.max_fan0_speed|default(255) %}

    {% if params.P is defined %}
        {% set p_num = params.P|int %}
        
        {% if p_num == 0 %}
            {% if params.S is defined %}
                {% set s_clamped = [params.S|int, max_fan0]|min %}
                SET_PIN PIN=fan{p_num} VALUE={s_clamped}
            {% else %}
                SET_PIN PIN=fan{p_num} VALUE={max_fan0}
            {% endif %}
        
        {% else %}
            {% if params.S is defined %}
                SET_PIN PIN=fan{p_num} VALUE={params.S|int}
            {% else %}
                SET_PIN PIN=fan{p_num} VALUE=255
            {% endif %}
        {% endif %}

    {% else %}
        {% if params.T is defined %}
            {% if params.T|int == -2 %}
                {% if params.S is defined %}
                    SET_PIN PIN=fan3 VALUE={params.S|int}
                {% else %}
                    SET_PIN PIN=fan3 VALUE=255
                {% endif %}
            {% endif %}
        
        {% else %}
            {% if params.S is defined %}
                {% set s_clamped = [params.S|int, max_fan0]|min %}
                SET_PIN PIN=fan0 VALUE={s_clamped}
            {% else %}
                SET_PIN PIN=fan0 VALUE={max_fan0}
            {% endif %}
        {% endif %}
    {% endif %}

