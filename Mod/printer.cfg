#####################################################################
#                            Bed
#####################################################################
[heater_bed]
heater_pin: PC7              
sensor_type: EPCOS 100K B57560G104F   
sensor_pin: PC0              
max_power: 1.0               
control: pid
pid_Kp=66.771 
pid_Ki=0.814 
pid_Kd=1369.644
min_temp: -200               
max_temp: 120                
##  "PID_CALIBRATE HEATER=heater_bed TARGET=100"

[verify_heater heater_bed]
max_error: 120
check_gain_time:400
hysteresis: 10
heating_gain: 2

[z_tilt]
z_positions: -27.9,108.75
            247.9,108.75
points:20,108.75
       200,108.75
speed: 130
horizontal_move_z: 3
retries: 7
retry_tolerance: 0.01
[bed_mesh]
speed: 300
horizontal_move_z: 1
mesh_min:3,12
mesh_max: 213,210
probe_count: 9, 9
algorithm:bicubic 
bicubic_tension:0.0275
mesh_pps: 5, 5 
move_check_distance:3 
split_delta_z: .01 
fade_start: 1 
fade_end: 10
fade_target: 0

#####################################################################
#                             Homing Sequence
#####################################################################

[homing_override]
set_position_z:0
gcode:
    SET_SKEW CLEAR=1
    G1 Z6 F400
    {% set HOME_CUR = 0.7 %}
    {% set driver_config = printer.configfile.settings['tmc2209 stepper_x'] %}
    {% set RUN_CUR = driver_config.run_current %}
    SET_VELOCITY_LIMIT ACCEL=500 #do not change value
    # Set current for sensorless homing
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    G4 P200
    {% if params.X is defined %}
    {% if params.Y is undefined %}
    {% if params.Z is undefined %}
     {% set HOME_CUR = 0.7 %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        SET_KINEMATIC_POSITION X=217
        G91
        G1 X3 F2000
        G90
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        G4 P200
        G28 X
        SKEW_PROFILE LOAD=calibrated 
        G1 X10 F1000
    {% endif %}
    {% endif %}
    {% endif %}

    {% if params.Y is defined %}
    {% if params.X is undefined %}
    {% if params.Z is undefined %}
     {% set HOME_CUR = 0.7 %}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        SET_KINEMATIC_POSITION Y=220
        G91
        G1 Y3 F2000
        G90
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        G4 P200
        G28 Y
        SKEW_PROFILE LOAD=calibrated 
        G1 Y10 F3000
    {% endif %}
    {% endif %}
    {% endif %}

    {% if params.X is undefined %}
    {% if params.Y is undefined %}
    {% if params.Z is defined %}
     {% set HOME_CUR = 0.7 %}
        SKEW_PROFILE LOAD=calibrated
        SET_KINEMATIC_POSITION Z=250
        G91 
        G1 Z-3 F300 
        G90 
        Z_DOUDONG
        M118 homing_override start
        probe
        SET_KINEMATIC_POSITION Z=0
        G90
        G1 Z10 F300
        M114
    {% endif %}
    {% endif %}
    {% endif %}

    {% if params.X is defined %}
    {% if params.Y is defined %}
    {% if params.Z is undefined %}
     {% set HOME_CUR = 0.7 %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        SET_KINEMATIC_POSITION X=217
        SET_KINEMATIC_POSITION Y=220
        G91
        G1 X3 F2000
        G1 Y3 F2000
        G90
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        G4 P200
        G28 X
        G90
        G1 X5 F3000
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        G4 P200
        G28 Y
        G90
        SKEW_PROFILE LOAD=calibrated
        G1 Y10 F3000
        SET_SKEW CLEAR=1
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        G4 P200
        G28 X
        SKEW_PROFILE LOAD=calibrated
        G90
        G1 X10 F3000
        G90 
    {% endif %}
    {% endif %}
    {% endif %}

    {% if (params.X is undefined and params.Y is undefined and params.Z is undefined) or (params.X is defined and params.Y is defined and params.Z is defined) %}							  
     {% set HOME_CUR = 0.7 %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        SET_KINEMATIC_POSITION X=217
        SET_KINEMATIC_POSITION Y=220
        G91
        G1 X3 F2000
        G1 Y3 F2000
        G90
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        G4 P200
        G28 X
        SKEW_PROFILE LOAD=calibrated
        G90
        G1 X5 F3000
        SET_SKEW CLEAR=1
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        G4 P200
        G28 Y
        SKEW_PROFILE LOAD=calibrated
        G90
        G1 Y10 F3000
        SET_SKEW CLEAR=1
        G4 P100
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        G4 P200
        G28 X
        SKEW_PROFILE LOAD=calibrated
        G1 X110 Y110 F10000
        SET_KINEMATIC_POSITION Z=255

        G91 
        G1 Z-3 F300 
        G90 
        Z_DOUDONG
        M118 homing_override start
        probe
        SET_KINEMATIC_POSITION Z=0
        G90
        G4 P100
        G1 Z10 F1500
    {% endif %} 

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR}
    M114
    SET_VELOCITY_LIMIT VELOCITY=600
    SET_VELOCITY_LIMIT ACCEL=20000
    G90
    M118 homing_override end
    {% if (printer.print_stats.state == "printing") and (params.X is undefined and params.Y is undefined and params.Z is undefined) %}
        M118 printer_status: {printer.print_stats.state}
        {% set bed_mesh_switch_value = printer.save_variables.variables.bed_mesh_switch_value %}
        {% if bed_mesh_switch_value == 1 %}    
            BED_MESH_CALIBRATE
        {% endif %} 
    {% endif %}
    GET_CURRENT_SKEW

