[filament_switch_sensor fila_sensor]
pause_on_runout: False
runout_gcode:  
    {action_respond_info("= The filament has ended")}
    SET_FILAMENT_SENSOR SENSOR=fila_motion ENABLE=0     # disable filament motion sensor
    {% if printer.print_stats.state|upper == "PRINTING" %}  # if state is printing then go to pause
        {action_respond_info("= Transition to pause")}
        _PAUSE_AFTER_D D={30}   # set waiting for pause after 30 mm filament
    {% endif %}
insert_gcode:
    {action_respond_info("= The filament has inserted")}
event_delay: 0.1
pause_delay: 0.1
switch_pin: PB5

# [filament_motion_sensor fila_motion]
